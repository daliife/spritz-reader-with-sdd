<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spritz Reader — Read faster, one word at a time</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- SEO -->
    <meta
      name="description"
      content="Read faster with Spritz-style speed reading. Focus on one word at a time and train your reading speed — right in your browser, no install needed."
    />
    <meta
      name="keywords"
      content="speed reading, spritz reader, RSVP reading, read faster, productivity"
    />
    <meta name="author" content="Spritz Reader" />
    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="light dark" />

    <!-- Mobile / PWA -->
    <meta
      name="theme-color"
      content="#4a6cf7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#6481f8"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Spritz Reader" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spritz Reader" />
    <meta
      property="og:title"
      content="Spritz Reader — Read faster, one word at a time"
    />
    <meta
      property="og:description"
      content="Read faster with Spritz-style speed reading. Focus on one word at a time and train your reading speed — right in your browser, no install needed."
    />
    <meta
      property="og:url"
      content="https://daliife.github.io/spritz-reader-with-sdd/"
    />
    <meta
      property="og:image"
      content="https://daliife.github.io/spritz-reader-with-sdd/og-image.svg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Spritz Reader — Read faster, one word at a time"
    />
    <meta
      name="twitter:description"
      content="Read faster with Spritz-style speed reading. Focus on one word at a time and train your reading speed — right in your browser."
    />
    <meta
      name="twitter:image"
      content="https://daliife.github.io/spritz-reader-with-sdd/og-image.svg"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://daliife.github.io/spritz-reader-with-sdd/"
    />
    <script>
      (function () {
        try {
          if (localStorage.getItem("spritz-theme") !== "light") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
