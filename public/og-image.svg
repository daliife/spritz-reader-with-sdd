<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"
  font-family="system-ui,-apple-system,'Helvetica Neue',sans-serif">

  <!-- Background -->
  <rect width="1200" height="630" fill="#0c0d18"/>

  <!-- Radial glow -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%"   stop-color="#6481f8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0c0d18" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Reader card -->
  <rect x="230" y="100" width="740" height="240" rx="20"
    fill="#131421" stroke="#6481f8" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Focal guide line -->
  <line x1="600" y1="118" x2="600" y2="322" stroke="#6481f8" stroke-width="2"/>

  <!-- Sample word: "sp" + "r" (ORP pivot) + "itz" -->
  <text y="268" font-size="100" font-weight="900"
    font-family="'Courier New',Courier,ui-monospace,monospace" text-anchor="middle">
    <tspan x="600">
      <tspan fill="#fafafa">sp</tspan><tspan fill="#6481f8">r</tspan><tspan fill="#fafafa">itz</tspan>
    </tspan>
  </text>

  <!-- WPM badge -->
  <rect x="253" y="152" width="96" height="28" rx="6" fill="#6481f8" fill-opacity="0.15"/>
  <text x="301" y="171" text-anchor="middle" font-size="13" font-weight="700"
    fill="#6481f8" letter-spacing="1.5">350 WPM</text>

  <!-- Title -->
  <text x="600" y="432" text-anchor="middle" font-size="56" font-weight="900"
    fill="#fafafa" letter-spacing="-1.5">Spritz Reader</text>

  <!-- Tagline -->
  <text x="600" y="488" text-anchor="middle" font-size="24" fill="#a1a1aa">
    Read faster, one word at a time.
  </text>

  <!-- URL -->
  <text x="600" y="576" text-anchor="middle" font-size="15" fill="#6481f8" fill-opacity="0.6">
    daliife.github.io/spritz-reader-with-sdd
  </text>
</svg>
